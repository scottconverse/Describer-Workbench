<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc"><title id="title">Narrated audio export</title><desc id="desc">Reviewed cues are synthesized with native Windows or OpenAI speech, timed to fit cue windows, and mixed with original audio downmixed to stereo. A merged cue-window gain envelope ducks the background once with 50 millisecond transitions. Delayed narration is mixed in batches to stereo MP3. No video file is produced.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#587263" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173c32}.label{font-size:18px;font-weight:600}.small{font-size:14px;fill:#52695c}.arrow{fill:none;stroke:#587263;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f0f3e8;stroke:#b5c7b0;stroke-width:1.5;rx:10}.external{fill:#e7eff1;stroke:#9cb6bd;stroke-width:1.5;rx:10}</style><rect width="1000" height="625" fill="#fcfcf7"/><text x="35" y="40" class="label" text-anchor="start">AUDIO EXPORT / CUES TO STEREO MP3</text><text x="35" y="66" class="small" text-anchor="start">Playback speech and export speech are separate paths.</text><rect x="40" y="110" width="265" height="100" class="box"/><text x="58" y="142" class="label" text-anchor="start">Reviewed cues</text><text x="58" y="168" class="small" text-anchor="start">Start, end and narration text</text><text x="58" y="190" class="small" text-anchor="start">Selected export engine</text><path d="M305 160H370" class="arrow"/><rect x="370" y="110" width="270" height="100" class="box"/><text x="388" y="142" class="label" text-anchor="start">Synthesize each cue</text><text x="388" y="168" class="small" text-anchor="start">Windows SAPI / OneCore</text><text x="388" y="190" class="small" text-anchor="start">or OpenAI text transmission</text><path d="M640 160H705" class="arrow"/><rect x="705" y="110" width="260" height="100" class="box"/><text x="723" y="142" class="label" text-anchor="start">Fit each WAV</text><text x="723" y="168" class="small" text-anchor="start">Probe speech duration</text><text x="723" y="190" class="small" text-anchor="start">Speed up if window is shorter</text><rect x="40" y="275" width="265" height="100" class="box"/><text x="58" y="307" class="label" text-anchor="start">Original video</text><text x="58" y="333" class="small" text-anchor="start">Decode/downmix audio to stereo</text><text x="58" y="355" class="small" text-anchor="start">No audio → generate silent bed</text><rect x="370" y="275" width="270" height="100" class="box"/><text x="388" y="307" class="label" text-anchor="start">Gain envelope</text><text x="388" y="333" class="small" text-anchor="start">Merge narration windows</text><text x="388" y="355" class="small" text-anchor="start">50 ms ducking transitions</text><path d="M172 210V250H505V275" class="arrow"/><rect x="370" y="440" width="270" height="90" class="box"/><text x="388" y="472" class="label" text-anchor="start">Duck background once</text><text x="388" y="498" class="small" text-anchor="start">Preserve narration gain</text><path d="M172 375V485H370" class="arrow"/><path d="M505 375V440" class="arrow"/><rect x="705" y="440" width="260" height="90" class="box"/><text x="723" y="472" class="label" text-anchor="start">Delay + mix narration</text><text x="723" y="498" class="small" text-anchor="start">Batched mixing; stereo MP3</text><path d="M640 485H705" class="arrow"/><path d="M835 210V440" class="arrow"/><text x="35" y="590" class="small" text-anchor="start">MP3 is audio-only. Source surround layout is not retained. Review the final mix for dialogue conflicts.</text></svg>