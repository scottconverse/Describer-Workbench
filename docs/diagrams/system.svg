<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">Desktop system architecture</title><desc id="desc">On the Windows computer, media and project data feed the Qt editor. Workers use FFmpeg, local speech and local Ollama. Separate external services are Gemini video uploads, Ollama cloud or remote image requests, and optional OpenAI text-to-speech. Output is saved locally. Cloud tags can route beyond a loopback Ollama server.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#587263" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173c32}.label{font-size:18px;font-weight:600}.small{font-size:14px;fill:#52695c}.arrow{fill:none;stroke:#587263;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f0f3e8;stroke:#b5c7b0;stroke-width:1.5;rx:10}.external{fill:#e7eff1;stroke:#9cb6bd;stroke-width:1.5;rx:10}</style><rect width="1000" height="660" fill="#fcfcf7"/><text x="35" y="40" class="label" text-anchor="start">DESCRIBER WORKBENCH / SYSTEM</text><text x="35" y="66" class="small" text-anchor="start">Local editorial workflow, with explicit service boundaries.</text><rect x="24" y="92" width="650" height="450" rx="14" fill="none" stroke="#b5c7b0" stroke-dasharray="7 5"/><text x="42" y="120" class="small" text-anchor="start">YOUR WINDOWS COMPUTER</text><rect x="50" y="150" width="220" height="90" class="box"/><text x="68" y="182" class="label" text-anchor="start">Media + project</text><text x="68" y="208" class="small" text-anchor="start">Video path, cues, glossary</text><rect x="330" y="150" width="310" height="90" class="box"/><text x="348" y="182" class="label" text-anchor="start">Qt editor + player</text><text x="348" y="208" class="small" text-anchor="start">Manual edits, review, confirmations</text><path d="M270 195H330" class="arrow"/><rect x="330" y="285" width="310" height="100" class="box"/><text x="348" y="317" class="label" text-anchor="start">Background workers</text><text x="348" y="343" class="small" text-anchor="start">Settings snapshot; cancellation</text><text x="348" y="365" class="small" text-anchor="start">FFmpeg segments and frame sampling</text><path d="M485 240V285" class="arrow"/><rect x="50" y="285" width="220" height="100" class="box"/><text x="68" y="317" class="label" text-anchor="start">Native speech</text><text x="68" y="343" class="small" text-anchor="start">SAPI / OneCore</text><text x="68" y="365" class="small" text-anchor="start">Local MP3 mix + ducking</text><path d="M330 330H270" class="arrow"/><rect x="50" y="425" width="220" height="85" class="box"/><text x="68" y="457" class="label" text-anchor="start">Saved output</text><text x="68" y="483" class="small" text-anchor="start">Project / SRT / text / MP3</text><path d="M160 385V425" class="arrow"/><rect x="330" y="425" width="310" height="85" class="box"/><text x="348" y="457" class="label" text-anchor="start">Local Ollama server</text><text x="348" y="483" class="small" text-anchor="start">Vision model; images without audio</text><path d="M485 385V425" class="arrow"/><text x="724" y="120" class="small" text-anchor="start">EXTERNAL SERVICES</text><rect x="710" y="150" width="260" height="90" class="external"/><text x="728" y="182" class="label" text-anchor="start">Gemini</text><text x="728" y="208" class="small" text-anchor="start">Video upload; audio optional</text><path d="M640 310H690V195H710" class="arrow"/><rect x="710" y="285" width="260" height="90" class="external"/><text x="728" y="317" class="label" text-anchor="start">Ollama cloud / remote</text><text x="728" y="343" class="small" text-anchor="start">Sampled frames and prompts</text><path d="M640 467H690V330H710" class="arrow"/><rect x="710" y="425" width="260" height="90" class="external"/><text x="728" y="457" class="label" text-anchor="start">OpenAI speech</text><text x="728" y="483" class="small" text-anchor="start">Description text only</text><path d="M270 362H300V560H690V467H710" class="arrow"/><text x="35" y="605" class="small" text-anchor="start">Transmission is tied to the selected workflow. Local Ollama can route cloud tags onward.</text><text x="35" y="629" class="small" text-anchor="start">Opening a local video does not itself trigger inference. AI cues require human review.</text></svg>