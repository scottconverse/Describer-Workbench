<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">Analysis lifecycle</title><desc id="desc">The editor confirms replacement and transmission, copies settings and project, prepares clips, calls either Ollama images or Gemini video, validates and accumulates returned cues with absolute offsets, and repeats sequential chunks. Only a complete successful result replaces the displayed project. Human review follows.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#587263" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173c32}.label{font-size:18px;font-weight:600}.small{font-size:14px;fill:#52695c}.arrow{fill:none;stroke:#587263;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f0f3e8;stroke:#b5c7b0;stroke-width:1.5;rx:10}.external{fill:#e7eff1;stroke:#9cb6bd;stroke-width:1.5;rx:10}</style><rect width="1000" height="740" fill="#fcfcf7"/><text x="35" y="40" class="label" text-anchor="start">ANALYSIS / REQUEST TO REVIEW</text><text x="35" y="66" class="small" text-anchor="start">Sequential chunks; the editor receives a new result only after successful completion.</text><rect x="40" y="105" width="280" height="95" class="box"/><text x="58" y="137" class="label" text-anchor="start">1. Choose + confirm</text><text x="58" y="163" class="small" text-anchor="start">Exact model, range and prompt</text><text x="58" y="185" class="small" text-anchor="start">Replacement / transmission prompts</text><path d="M320 152H370" class="arrow"/><rect x="370" y="105" width="280" height="95" class="box"/><text x="388" y="137" class="label" text-anchor="start">2. Snapshot + prepare</text><text x="388" y="163" class="small" text-anchor="start">Copy project/settings</text><text x="388" y="185" class="small" text-anchor="start">FFmpeg prepares the next clip</text><path d="M510 200V250" class="arrow"/><rect x="210" y="250" width="300" height="100" class="box"/><text x="228" y="282" class="label" text-anchor="start">3a. Ollama</text><text x="228" y="308" class="small" text-anchor="start">Up to 8 timestamped 640px frames</text><text x="228" y="330" class="small" text-anchor="start">No audio; exact request profile</text><rect x="560" y="250" width="300" height="100" class="box"/><text x="578" y="282" class="label" text-anchor="start">3b. Gemini</text><text x="578" y="308" class="small" text-anchor="start">Upload video clip; request JSON</text><text x="578" y="330" class="small" text-anchor="start">Audio unless silent upload selected</text><path d="M510 225H710V250" class="arrow"/><path d="M510 225H360V250" class="arrow"/><path d="M360 350V395H505V430" class="arrow"/><path d="M710 350V395H505" class="arrow"/><rect x="330" y="430" width="350" height="100" class="box"/><text x="348" y="462" class="label" text-anchor="start">4. Validate + accumulate</text><text x="348" y="488" class="small" text-anchor="start">Normalize cues; offset absolute times</text><text x="348" y="510" class="small" text-anchor="start">Merge glossary; repeat next chunk</text><path d="M680 480H925V152H650" class="arrow"/><text x="790" y="466" class="small" text-anchor="middle">Next chunk</text><path d="M505 530V575" class="arrow"/><rect x="330" y="575" width="350" height="90" class="box"/><text x="348" y="607" class="label" text-anchor="start">5. Commit, then review</text><text x="348" y="633" class="small" text-anchor="start">Replace cues/glossary on success</text><text x="348" y="655" class="small" text-anchor="start">Human edits → save → export</text><text x="35" y="705" class="small" text-anchor="start">Failure, cancellation or truncation: no partial cue-list replacement in the displayed project.</text></svg>