[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "describer-workbench"
version = "0.6.1"
description = "Shared audio-description engine, desktop workbench, CLI, HTTP and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md", "third-party-licenses/*"]
dependencies = ["portalocker>=3.2,<4"]

[project.optional-dependencies]
desktop = ["PySide6==6.12.0", "accessible-output2==0.17", "cryptography==50.0.2", "google-genai==2.34.0", "yt-dlp==2026.10.26", "numpy>=2,<3", "onnxruntime>=1.23,<2", "keyring==25.7.0; sys_platform != 'win32'"]
http = ["fastapi>=0.162,<1", "uvicorn>=0.34,<1"]
mcp = ["mcp>=1.20,<2"]
local = ["numpy>=2,<3", "onnxruntime>=1.23,<2"]
gemini = ["google-genai==2.34.0"]
download = ["yt-dlp==2026.10.26"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "build>=1.2", "ruff>=0.12"]

[project.scripts]
describer = "describer.cli:main"
describer-mcp = "describer.adapters.mcp:main"

[project.gui-scripts]
describer-workbench = "describer.app:main"

[project.urls]
Homepage = "https://describer-workbench.sconverse.chatgpt.site"
Source = "https://github.com/scottconverse/Describer-Workbench"
Documentation = "https://github.com/scottconverse/Describer-Workbench/blob/main/docs/USER-MANUAL.md"
Issues = "https://github.com/scottconverse/Describer-Workbench/issues"

[tool.hatch.build.targets.wheel]
packages = ["describer"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "describer/resources"

[tool.hatch.build.targets.sdist]
include = [".github", "describer", "assets", "bin/FFmpeg-LICENSE.txt", "tests", "docs", "website", "tools", "run.py", "run_cli.py", "build.ps1", "DescriberWorkbench.spec", "DescriberUnix.spec", "requirements.txt", "README.md", "LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md", "third-party-licenses", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
