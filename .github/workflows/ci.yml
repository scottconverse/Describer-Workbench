name: Windows CI

on:
  push:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths-ignore: ['**.md', '**.mdx', '**.rst', '**.docx', '**.pdf', '**/LICENSE', '**/LICENSE.*', '**/NOTICE', '**/NOTICE.*', 'docs/**.png', 'docs/**.jpg', 'docs/**.svg', 'docs/**.gif', 'docs/**.webp', 'docs/**.html', 'docs/**.css', 'website/**']
    branches: [main, feat/shared-engine-v050]
    tags: ['v*']
  pull_request:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths-ignore: ['**.md', '**.mdx', '**.rst', '**.docx', '**.pdf', '**/LICENSE', '**/LICENSE.*', '**/NOTICE', '**/NOTICE.*', 'docs/**.png', 'docs/**.jpg', 'docs/**.svg', 'docs/**.gif', 'docs/**.webp', 'docs/**.html', 'docs/**.css', 'website/**']

permissions:
  contents: read

jobs:
  windows:
    name: Windows tests and packages
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_DISABLE_TELEMETRY: '1'
      OTEL_SDK_DISABLED: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install hash-pinned FFmpeg media tools
        shell: pwsh
        run: |
          "DESCRIBER_HOME=$(Join-Path $env:RUNNER_TEMP 'describer-ci')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') {
            throw 'FFmpeg download hash mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          (Join-Path $destination 'ffmpeg-9.0.2-essentials_build/bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install test and documentation dependencies
        run: python -m pip install -e ".[desktop,local,http,mcp,dev]" -r docs/requirements.txt
      - name: Lint shared engine and protocol checks
        run: python -m ruff check --select F describer/engine describer/adapters describer/cli.py tests/test_engine.py tests/test_protocols.py tests/test_media_exports.py tools
      - name: Test desktop, engine, media, documentation and protocols
        run: python -m pytest -q --junitxml=${{ runner.temp }}/pytest-results.xml --basetemp=${{ runner.temp }}/describer-pytest
      - name: Build Python distributions and website
        run: |
          python -m build --outdir release-packages
          python tools/build_site.py --output "${{ runner.temp }}/describer-site"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-packages
          path: release-packages/*
          if-no-files-found: error
