name: Stabilization source checks

on:
  push:
    branches: ['stabilization/**']
    paths: ['describer/**', 'tests/**', 'tools/**', '.github/workflows/stabilization.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Run only a platform whose evidence needs refreshing
        type: choice
        options: [all, linux, macos]
        default: all
      scope:
        description: Reuse unaffected GUI evidence for a file-format-only correction
        type: choice
        options: [preservation, format, keyring]
        default: preservation

permissions:
  contents: read

jobs:
  source:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON((contains(github.event.head_commit.message, '[keyring-only]') || inputs.target == 'linux') && '[{"platform":"linux","runner":"ubuntu-24.04"}]' || inputs.target == 'macos' && '[{"platform":"macos","runner":"macos-15"}]' || '[{"platform":"linux","runner":"ubuntu-24.04"},{"platform":"macos","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_DISABLE_TELEMETRY: '1'
      OTEL_SDK_DISABLED: 'true'
      DO_NOT_TRACK: '1'
      TEST_SCOPE: ${{ contains(github.event.head_commit.message, '[keyring-only]') && 'keyring' || contains(github.event.head_commit.message, '[format-only]') && 'format' || inputs.scope || 'preservation' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Resource headroom
        run: df -h
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libpulse0 libglib2.0-0t64 gnome-keyring dbus-x11
      - name: Desktop dependencies
        run: python -m pip install -e '.[desktop,local,dev]'
      - name: Affected source and real Qt controls
        run: |
          run_tests() {
            if [ "$RUNNER_OS" = Linux ]; then
              dbus-run-session -- sh -c 'printf "ci-only" | gnome-keyring-daemon --unlock --components=secrets; exec python -m pytest "$@"' sh "$@"
            else
              python -m pytest "$@"
            fi
          }
          if [ "$TEST_SCOPE" = format ]; then
            run_tests -q tests/test_range_drafting.py -k 'legacy_projects or invalid_identity or draft_rejects' --junitxml=stabilization.xml
          elif [ "$TEST_SCOPE" = keyring ]; then
            run_tests -q tests/test_models.py -k url_safeguards_and_settings_migration_secret_storage --junitxml=stabilization.xml
          else
            run_tests -q tests/test_range_drafting.py tests/test_project.py tests/test_desktop_redesign.py tests/test_incremental_editing.py tests/test_desktop_accessibility.py tests/test_project_recovery.py tests/test_speech_cache.py tests/test_draft_workflow.py tests/test_export_preview.py tests/test_editor_selection.py tests/test_gui.py tests/test_models.py --junitxml=stabilization.xml
          fi
      - name: Affected desktop lint and selection types
        run: |
          python -m ruff check --select F describer/app.py describer/desktop.py describer/editor_history.py describer/editor_selection.py describer/export_preview.py describer/i18n.py
          python -m mypy --strict --follow-imports=silent describer/editor_selection.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stabilization-${{ matrix.platform }}-${{ github.sha }}
          path: stabilization.xml
          if-no-files-found: warn
