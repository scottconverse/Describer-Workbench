name: Stabilization source checks

on:
  push:
    branches: ['stabilization/**']
    paths: ['describer/**', 'tests/**', 'tools/**', '.github/workflows/stabilization.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Run only a platform whose evidence needs refreshing
        type: choice
        options: [all, linux, macos]
        default: all
      scope:
        description: Reuse unaffected GUI evidence for a file-format-only correction
        type: choice
        options: [preservation, format]
        default: preservation

permissions:
  contents: read

jobs:
  source:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(inputs.target == 'linux' && '[{"platform":"linux","runner":"ubuntu-24.04"}]' || inputs.target == 'macos' && '[{"platform":"macos","runner":"macos-15"}]' || '[{"platform":"linux","runner":"ubuntu-24.04"},{"platform":"macos","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_DISABLE_TELEMETRY: '1'
      OTEL_SDK_DISABLED: 'true'
      DO_NOT_TRACK: '1'
      TEST_SCOPE: ${{ contains(github.event.head_commit.message, '[format-only]') && 'format' || inputs.scope || 'preservation' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Resource headroom
        run: df -h
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libpulse0 libglib2.0-0t64
      - name: Desktop dependencies
        run: python -m pip install -e '.[desktop,local,dev]'
      - name: Affected source and real Qt controls
        run: |
          if [ "$TEST_SCOPE" = format ]; then
            python -m pytest -q tests/test_range_drafting.py -k 'legacy_projects or invalid_identity or draft_rejects' --junitxml=stabilization.xml
          else
            python -m pytest -q tests/test_range_drafting.py tests/test_project.py tests/test_desktop_redesign.py --junitxml=stabilization.xml
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stabilization-${{ matrix.platform }}-${{ github.sha }}
          path: stabilization.xml
          if-no-files-found: warn
