name: macOS and Linux add-ons

on:
  workflow_dispatch:
  pull_request:
    paths: ['describer/**', 'tests/**', 'tools/**', 'DescriberUnix.spec', 'pyproject.toml', '.github/workflows/unix-addons.yml']

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }} native install and acceptance
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      OTEL_SDK_DISABLED: 'true'
      DO_NOT_TRACK: '1'
      DESCRIBER_HOME: /tmp/describer-native-${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Record resource headroom
        run: df -h
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng speech-dispatcher gnome-keyring dbus-x11 xvfb xterm openbox wmctrl libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0
      - name: Mac ephemeral acceptance keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci-only "$RUNNER_TEMP/describer.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/describer.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/describer.keychain-db" login.keychain-db
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/describer.keychain-db"
          security unlock-keychain -p ci-only "$RUNNER_TEMP/describer.keychain-db"
      - name: Python desktop and build dependencies
        run: python -m pip install -e ".[desktop,http,mcp,dev]" -r docs/requirements.txt pyinstaller==6.22.3
      - name: Build pinned Mac media tools
        if: runner.os == 'macOS'
        run: |
          python tools/build_unix_media.py
          echo "$PWD/unix-media/bin" >> "$GITHUB_PATH"
      - name: Affected lint
        run: python -m ruff check --select F describer/engine describer/adapters describer/cli.py tests/test_engine.py tests/test_protocols.py tests/test_media_exports.py tools tests/test_platforms.py
      - name: Linux native tests
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- sh -c 'printf "ci-only" | gnome-keyring-daemon --unlock --components=secrets; python -m pytest -q --junitxml="$RUNNER_TEMP/native-tests.xml"'
      - name: Mac native tests
        if: runner.os == 'macOS'
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/native-tests.xml"
      - name: Freeze platform add-on
        run: python -m PyInstaller --noconfirm --distpath dist-unix --workpath build-unix/frozen DescriberUnix.spec
      - name: Package installers
        run: python tools/package_unix.py --output unix-packages
      - name: Retain native candidate and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unix-${{ matrix.target }}-${{ github.sha }}
          path: |
            unix-packages/*.dmg
            unix-packages/*.deb
            unix-packages/*.tar.gz
            unix-packages/*.json
            unix-packages/*.txt
            ${{ runner.temp }}/native-tests.xml
          if-no-files-found: warn

  acceptance:
    name: ${{ matrix.target }} installed acceptance
    needs: native
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      OTEL_SDK_DISABLED: 'true'
      DO_NOT_TRACK: '1'
      DESCRIBER_HOME: /tmp/describer-native-${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unix-${{ matrix.target }}-${{ github.sha }}
          path: candidate
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng speech-dispatcher gnome-keyring dbus-x11 xvfb xterm openbox wmctrl libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0
      - name: Mac ephemeral acceptance keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci-only "$RUNNER_TEMP/describer.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/describer.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/describer.keychain-db" login.keychain-db
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/describer.keychain-db"
          security unlock-keychain -p ci-only "$RUNNER_TEMP/describer.keychain-db"
      - name: Acceptance dependencies
        run: python -m pip install -e ".[desktop,http,mcp,dev]" pyinstaller==6.22.3
      - name: Locate and authenticate the retained candidate
        run: |
          mkdir unix-packages
          find candidate -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.tar.gz' -o -name 'SHA256SUMS.txt' \) -exec cp {} unix-packages/ \;
          cd unix-packages
          shasum -a 256 -c SHA256SUMS.txt
      - name: Linux install and acceptance
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./unix-packages/*.deb
          xvfb-run -a dbus-run-session -- sh -c 'printf "ci-only" | gnome-keyring-daemon --unlock --components=secrets; openbox > "$RUNNER_TEMP/openbox.log" 2>&1 & python tools/verify_unix.py --payload /opt/describer-workbench --output "$RUNNER_TEMP/unix-acceptance" --source-install'
          sudo apt-get remove -y describer-workbench
          test ! -e /usr/bin/describer-workbench
          test -f "$RUNNER_TEMP/unix-acceptance/receipt.json"
      - name: Mac DMG install and acceptance
        if: runner.os == 'macOS'
        run: |
          mkdir "$RUNNER_TEMP/describer-mount" "$RUNNER_TEMP/installed"
          hdiutil attach unix-packages/*.dmg -mountpoint "$RUNNER_TEMP/describer-mount" -nobrowse
          ditto "$RUNNER_TEMP/describer-mount/Describer Workbench.app" "$RUNNER_TEMP/installed/Describer Workbench.app"
          hdiutil detach "$RUNNER_TEMP/describer-mount"
          export PATH="$RUNNER_TEMP/installed/Describer Workbench.app/Contents/Frameworks/bin:$PATH"
          python tools/verify_unix.py --payload "$RUNNER_TEMP/installed/Describer Workbench.app" --output "$RUNNER_TEMP/unix-acceptance" --source-install
      - name: Retain installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unix-acceptance-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/unix-acceptance
          if-no-files-found: warn
